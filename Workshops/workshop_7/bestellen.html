<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale=1.0">
    <title>Sneakerspot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>Sneakerspot</h1>
            <ul id="menu">
                <li><a href="index.html">Producten</a></li>
                <li><a href="#">Over ons</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div> <!-- einde header  -->

        <div id="content">
            <h2>Bestellen: Groene Sneakers</h2>
            <form class="formulier">
                <div class="veld">
                    <label for="voornaam">voormaan</label>
                    <input type="text" id="voornaam" name="voornaam" placeholder="Bijvoorbeeld: Chloe" required>
                </div>

                <div class="veld">
                    <label for="achternaam">achternaam</label>
                    <input type="text" id="achternaam" name="achternaam" placeholder="Bijvoorbeeld: Godet" required>
                </div>

                <div class="veld">
                    <label for="email">E-mailadress</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="veld">
                    <label for="aantal">Aantal</label>
                    <input type="nummer" id="aantal" name="aantal" min="1" max="10" value="1" required>
                </div>

                <div class="veld">
                    <label for="maat">Maat</label>
                    <select id="maat" name="maat">
                        <option value="40">40</option>
                        <option value="41">41</option>
                        <option value="42">42</option>
                        <option value="43">43</option>
                        <option value="44">44</option>
                    </select>
                </div>

                <div class="veld">
                    <input type="checkbox" id="voorwaarden" name="voorwaarden" required>
                    <label for="voorwaarden">Ik ga akkoord met de voorwaarden</label>
                </div>

                <div class="veld vinkje"

                <input type="submit" value="Bestellingen plaatsen" class="knop">
            </form>
    </div> <!-- einde content  -->

        <div id="footer"> 2026 Sneakerspot</div> <!-- einde footer  -->

    </div>

    <h2>onze sneakers</h2>
    <div class="producten">
        <div class="product">groene sneakers</div>
        <div class="product">regenboog sneakers</div>
        <div class="product">rode sneakers</div>
        <div class="product">witte sneakers</div>
        <div class="product">zwarte sneakers</div>
        <div class="product">grijze sneakers</div>
    </div>

</body>

</html>
